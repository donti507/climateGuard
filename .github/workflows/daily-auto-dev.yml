name: Daily Auto Dev

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: daily-auto-dev
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GH_PAT }}
  OPENAI_API_KEY: ${{ secrets.PSNC_API_KEY }}
  OPENAI_API_BASE: ${{ secrets.PSNC_API_BASE }}   # https://llm.hpc.psnc.pl/v1
  MODEL_NAME: "openai/Qwen3-Coder-Next"

jobs:
  run-daily-batch:
    runs-on: ubuntu-latest
    if: contains(github.repository, 'climateGuard')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bail out if killswitch present
        run: |
          if [ -f .github/WORKFLOW_KILLSWITCH ]; then
            echo "Killswitch active — skipping today's run."
            exit 1
          fi

      - name: Set up JDK 17 + Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Python (for aider)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install aider
        run: pip install aider-chat

      - name: Set up git identity for the agent's commits
        run: |
          git config --global user.name "climateguard-auto-dev"
          git config --global user.email "auto-dev@users.noreply.github.com"

      - name: Decode task list to a runner-local temp file (never committed)
        run: |
          echo "${{ secrets.TASKLIST_B64 }}" | base64 -d > /tmp/tasklist.txt
          echo "Decoded $(wc -l < /tmp/tasklist.txt) tasks."

      - name: Read/init progress counter
        id: progress
        run: |
          # A bare integer only — "which day we're on" — committed to the repo.
          # Reveals nothing about what the tasks are, only that N have been done.
          if [ -f .github/AUTOMATION_PROGRESS ]; then
            NEXT=$(cat .github/AUTOMATION_PROGRESS)
          else
            NEXT=1
          fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Run a randomized batch of 1-3 tasks today
        run: |
          set -euo pipefail
          TOTAL=$(wc -l < /tmp/tasklist.txt)
          NEXT=${{ steps.progress.outputs.next }}
          BATCH_SIZE=$(( (RANDOM % 3) + 1 ))
          echo "Starting at task $NEXT of $TOTAL, batch size $BATCH_SIZE"

          for i in $(seq 1 "$BATCH_SIZE"); do
            if [ "$NEXT" -gt "$TOTAL" ]; then
              echo "All tasks complete — nothing left to do."
              break
            fi

            git checkout main
            git pull origin main

            LINE=$(sed -n "${NEXT}p" /tmp/tasklist.txt)
            LABEL=$(echo "$LINE" | cut -d'|' -f1 | tr -d ' ')
            DESC=$(echo "$LINE" | cut -d'|' -f2-)
            SLUG=$(echo "$LABEL" | tr '[:upper:]' '[:lower:]' | tr -d ' ')
            BRANCH="auto/${SLUG}-$(date +%Y%m%d%H%M%S)"

            echo "=== $LABEL ($NEXT of $TOTAL) ==="
            git checkout -b "$BRANCH"

            aider \
              --model "$MODEL_NAME" \
              --yes-always \
              --no-check-update \
              --message "
                You are working in the ClimateGuard Spring Boot repo (Java 17, Spring Boot 3.2,
                PostgreSQL, Flyway, MapStruct, JWT security), already on branch $BRANCH.

                Task: $DESC

                1. Implement it fully and correctly — real code, not a stub. Match the existing
                   package structure and conventions (Controller -> Service -> Repository).
                2. Add or update tests covering the new/changed behavior.
                3. Update README.md's endpoint table if you added or changed an endpoint.

                Do not run shell commands yourself; just edit files. I will run tests and commit
                separately after you finish.
              "

            echo "Running tests..."
            if mvn -q test; then
              echo "Tests passed."
            else
              echo "Tests failed — committing work-in-progress anyway so it's visible in the PR."
            fi

            git add -A
            git commit -m "feat: $LABEL - $DESC" || echo "No changes to commit."
            git push -u origin "$BRANCH"

            gh pr create \
              --title "Auto: $LABEL" \
              --body "Automated attempt at: $DESC

Model: $MODEL_NAME
Branch: $BRANCH

Please review before merging — this PR was generated by the daily-auto-dev workflow
and has NOT been auto-merged. Check the test results in the CI run on this PR." \
              --base main --head "$BRANCH" || echo "PR creation failed or already exists."

            # NOTE: auto-merge intentionally removed. PRs from this workflow wait for
            # human review before landing on main. Re-add a `gh pr merge --auto --squash`
            # call here only if you deliberately want unattended merges again.

            NEXT=$((NEXT + 1))
          done

          git checkout main
          git pull origin main
          echo "$NEXT" > .github/AUTOMATION_PROGRESS
          git add .github/AUTOMATION_PROGRESS
          git commit -m "chore: advance automation progress to task $NEXT" || echo "No progress change to commit."
          git push origin main
